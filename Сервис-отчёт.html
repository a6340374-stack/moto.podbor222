<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Дмитрий · Мотоподбор — отчёт эксперта</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f2; --card:#ffffff; --ink:#14171c; --mut:#646b75; --line:#e3e7eb; --line2:#eef1f4;
  --green:#0a9d57; --greenbg:#e7f6ee; --graphite:#1d2530; --amber:#c97a12; --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:#d7dbe0;color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.app{max-width:440px;margin:0 auto;background:var(--bg);min-height:100vh;position:relative;overflow:hidden;padding-bottom:80px}
.mono{font-family:'IBM Plex Mono',monospace}
.eyebrow{font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--green);font-weight:600}
section{padding:38px 18px}
h2{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.lead{color:var(--mut);font-size:14.5px;margin-top:10px}
.sec-head{margin-bottom:22px}

/* top */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;background:rgba(238,240,242,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .logo{font-weight:700;font-size:16px;letter-spacing:-.01em}
.top .logo b{color:var(--green)}
.top .city{font-family:'IBM Plex Mono';font-size:11px;color:var(--mut);display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.06em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(10,157,87,.16)}

/* hero report */
.hero{padding:24px 18px 8px}
.docline{display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.08em;color:var(--mut);text-transform:uppercase;border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:18px}
.docline .ok{color:var(--green)}
.hero h1{font-size:33px;font-weight:700;letter-spacing:-.02em;line-height:1.04}
.hero h1 .g{color:var(--green)}
.hero p.sub{color:var(--mut);font-size:15px;margin-top:14px;max-width:340px}
.expert{display:flex;align-items:center;gap:12px;margin-top:20px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.expert img{width:50px;height:50px;border-radius:11px;object-fit:cover;object-position:50% 30%}
.expert .nm{font-weight:600;font-size:15px}
.expert .rt{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:6px}
.expert .stars{color:#e8a91e;letter-spacing:1px}
.expert .vf{margin-left:auto;font-family:'IBM Plex Mono';font-size:10px;color:var(--green);text-align:right;text-transform:uppercase;letter-spacing:.05em;line-height:1.4}
.cta-row{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:13px;font-weight:600;font-size:15px;text-decoration:none;border:0;cursor:pointer;font-family:'IBM Plex Sans'}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--green);color:#fff}
.btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}

/* scorecard */
.score{background:var(--graphite);color:#fff;border-radius:18px;padding:20px;margin-top:8px}
.score .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.score .h .t{font-family:'IBM Plex Mono';font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#aab3c0}
.score .h .b{background:var(--green);color:#fff;font-family:'IBM Plex Mono';font-size:11px;padding:4px 9px;border-radius:6px;letter-spacing:.05em}
.score .grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(255,255,255,.1);border-radius:10px;overflow:hidden}
.score .it{background:var(--graphite);padding:13px 14px}
.score .it .l{font-size:12px;color:#aab3c0}
.score .it .v{display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px;margin-top:3px}
.score .it .v .ck{width:16px;height:16px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;flex:0 0 16px}
.score .it .v .ck svg{width:10px;height:10px;color:#fff}

/* checklist */
.clist{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.crow{display:flex;gap:13px;padding:16px;border-bottom:1px solid var(--line2)}
.crow:last-child{border-bottom:0}
.crow .ix{font-family:'IBM Plex Mono';font-size:11px;color:var(--mut);flex:0 0 24px;padding-top:3px}
.crow .ck{flex:0 0 24px;height:24px;border-radius:50%;background:var(--greenbg);display:flex;align-items:center;justify-content:center}
.crow .ck svg{width:14px;height:14px;color:var(--green)}
.crow h3{font-size:15px;font-weight:600}
.crow p{font-size:13px;color:var(--mut);margin-top:3px}

/* spec table */
.spec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.spec .row{display:flex;justify-content:space-between;gap:16px;padding:13px 16px;border-bottom:1px solid var(--line2);font-size:13.5px}
.spec .row:last-child{border-bottom:0}
.spec .row .k{color:var(--mut)}
.spec .row .v{font-weight:600;text-align:right}
.spec .row .v.y{color:var(--green)}

/* process */
.proc{counter-reset:s;display:flex;flex-direction:column;gap:10px}
.pstep{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:14px}
.pstep .n{font-family:'IBM Plex Mono';font-weight:600;color:var(--green);font-size:13px;flex:0 0 34px;height:34px;border:1px solid var(--line);border-radius:9px;display:flex;align-items:center;justify-content:center}
.pstep h3{font-size:15px;font-weight:600}
.pstep p{font-size:13px;color:var(--mut);margin-top:3px}

/* pricing */
.ptable{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prow{padding:16px;border-bottom:1px solid var(--line2);position:relative}
.prow:last-child{border-bottom:0}
.prow.hit{background:var(--greenbg)}
.prow .top2{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.prow .t{font-weight:600;font-size:15px}
.prow .p{font-family:'IBM Plex Mono';font-weight:600;font-size:18px;white-space:nowrap}
.prow.hit .p{color:var(--green)}
.prow .d{font-size:12.5px;color:var(--mut);margin-top:5px}
.prow .badge{position:absolute;top:-1px;right:0;background:var(--green);color:#fff;font-family:'IBM Plex Mono';font-size:9px;letter-spacing:.1em;padding:3px 8px;border-bottom-left-radius:8px;text-transform:uppercase}

/* gallery grid */
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gitem{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.gitem img{width:100%;height:120px;object-fit:cover;display:block}
.gitem .cp{padding:8px 10px}
.gitem .ix{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.06em;color:var(--green);text-transform:uppercase}
.gitem .cp p{font-size:11px;color:var(--mut);margin-top:2px;line-height:1.35}

/* reviews */
.ratebox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;gap:18px;align-items:center;margin-bottom:16px}
.ratebox .big{font-size:46px;font-weight:700;line-height:.9}
.ratebox .stars{color:#e8a91e;font-size:15px;letter-spacing:1px}
.ratebox .meta{font-size:12px;color:var(--mut);margin-top:4px}
.bars{flex:1;display:flex;flex-direction:column;gap:5px}
.bar{display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono';font-size:10px;color:var(--mut)}
.bar .track{flex:1;height:6px;border-radius:3px;background:var(--line)}
.bar .fill{height:100%;border-radius:3px;background:var(--green)}
.revscroll{display:flex;gap:11px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 18px 8px;margin:0 -18px;scrollbar-width:none}
.revscroll::-webkit-scrollbar{display:none}
.revcard{flex:0 0 250px;scroll-snap-align:center;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:zoom-in}
.revcard img{width:100%;display:block;max-height:400px;object-fit:cover;object-position:top}
.hint{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--mut);text-align:center;margin-top:10px;letter-spacing:.04em;text-transform:uppercase}

/* faq */
.faq{display:flex;flex-direction:column;gap:8px}
.qa{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.qa summary{list-style:none;cursor:pointer;padding:15px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:600;font-size:14.5px}
.qa summary::-webkit-details-marker{display:none}
.qa .plus{flex:0 0 18px;height:18px;position:relative}
.qa .plus::before,.qa .plus::after{content:"";position:absolute;background:var(--green)}
.qa .plus::before{left:0;right:0;top:8px;height:2px}
.qa .plus::after{top:0;bottom:0;left:8px;width:2px;transition:.25s}
.qa[open] .plus::after{transform:scaleY(0)}
.qa .a{padding:0 16px 16px;font-size:13.5px;color:var(--mut)}

/* final */
.final{background:var(--graphite);color:#fff;border-radius:20px;padding:30px 20px;text-align:center}
.final h2{color:#fff;font-size:27px}
.final p{color:#aeb6c1;font-size:14px;margin:12px auto 20px;max-width:300px}
.final .btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.22);color:#fff}

footer{padding:26px 18px;color:var(--mut);font-size:12px;font-family:'IBM Plex Mono';text-align:center;line-height:1.7}
footer b{color:var(--ink)}

.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:440px;margin:0 auto;display:flex;gap:10px;
  padding:11px 14px calc(11px + env(safe-area-inset-bottom));background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.bottombar .btn{height:48px;font-size:14.5px}

.lb{position:fixed;inset:0;z-index:100;background:rgba(10,14,20,.9);display:none;align-items:center;justify-content:center;padding:24px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:88vh;border-radius:12px}
.lb .x{position:absolute;top:18px;right:18px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:22px;cursor:pointer}

.modal{position:fixed;inset:0;z-index:120;display:none;align-items:flex-end;justify-content:center;background:rgba(10,14,20,.5)}
.modal.on{display:flex}
.sheet{width:100%;max-width:440px;background:var(--card);border-radius:22px 22px 0 0;padding:24px 18px calc(24px + env(safe-area-inset-bottom));animation:up .3s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet h3{font-size:23px;font-weight:700}
.sheet p.s{color:var(--mut);font-size:13.5px;margin:8px 0 16px}
.field{margin-bottom:11px}
.field label{display:block;font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.06em;color:var(--mut);margin-bottom:5px;text-transform:uppercase}
.field input,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:12px 13px;color:var(--ink);font-family:'IBM Plex Sans';font-size:15px}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--green)}
.thanks{text-align:center;padding:16px 0}
.thanks .ok{width:60px;height:60px;border-radius:50%;background:var(--greenbg);color:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.thanks .ok svg{width:28px;height:28px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="lb" id="lb"><button class="x" onclick="closeLB()">×</button><img id="lbimg" src="" alt=""></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script src="content.js"></script>
<script>
const M=window.MP;
const ck='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>';
const ic={
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H8l-4 4V5z"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h4l2 5-3 2a14 14 0 006 6l2-3 5 2v4a2 2 0 01-2 2A17 17 0 013 6a2 2 0 012-2z"/></svg>'
};
const specRows=[
  {k:"Вид услуги",v:"Осмотр мототехники"},
  {k:"Опыт работы",v:M.experience,y:true},
  {k:"Выезд к клиенту",v:"Да",y:true},
  {k:"Гарантия на работы",v:"Да",y:true},
  {k:"Срочные заказы",v:"Да",y:true},
  {k:"Где работает",v:"У клиента / удалённо"},
  {k:"Рабочие дни",v:"Пн–Вс"},
  {k:"Документы",v:"Проверены",y:true}
];
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;};

document.getElementById('app').innerHTML=`
<div class="top">
  <div class="logo">${M.expert} · <b>${M.brand}</b></div>
  <div class="city"><span class="dot"></span> ${M.city} · онлайн</div>
</div>

<header class="hero">
  <div class="docline"><span>Отчёт эксперта · ${M.city}</span><span class="ok">● Документы проверены</span></div>
  <div class="eyebrow">Диагностика перед покупкой</div>
  <h1 style="margin-top:8px">Технический отчёт по&nbsp;мотоциклу <span class="g">до сделки</span></h1>
  <p class="sub">${M.subtagline}</p>
  <div class="expert">
    <img src="assets/avatar.jpg" alt="${M.expert}">
    <div>
      <div class="nm">${M.expert}</div>
      <div class="rt"><span class="stars">★★★★★</span> ${M.rating} · ${M.reviewsCount} отзывов</div>
    </div>
    <div class="vf">Эксперт<br>по мототехнике</div>
  </div>
  <div class="cta-row">
    <a class="btn btn-primary" href="javascript:openForm()">${ic.chat} Заказать осмотр</a>
    <a class="btn btn-ghost" href="${M.phoneHref}">${ic.phone} Позвонить</a>
  </div>
</header>

<section style="padding-top:18px">
  <div class="score">
    <div class="h"><span class="t">Объём проверки</span><span class="b">Полная диагностика</span></div>
    <div class="grid">
      <div class="it"><div class="l">Техническая часть</div><div class="v"><span class="ck">${ck}</span> Мотор · КПП</div></div>
      <div class="it"><div class="l">Состояние ДВС</div><div class="v"><span class="ck">${ck}</span> Эндоскопия</div></div>
      <div class="it"><div class="l">Кузов и ЛКП</div><div class="v"><span class="ck">${ck}</span> ДТП · перекрас</div></div>
      <div class="it"><div class="l">Юридика</div><div class="v"><span class="ck">${ck}</span> Залоги · запреты</div></div>
    </div>
  </div>
</section>

<section style="padding-top:6px">
  <div class="sec-head"><div class="eyebrow">Чек-лист</div><h2>Что входит в проверку</h2>
  <p class="lead">Каждый пункт фиксируется в отчёте с фото и видео.</p></div>
  <div class="clist">
    ${M.checks.map((c,i)=>`<div class="crow"><div class="ix">${String(i+1).padStart(2,'0')}</div><div class="ck">${ck}</div><div><h3>${c.t}</h3><p>${c.d}</p></div></div>`).join('')}
  </div>
</section>

<section style="padding-top:0">
  <div class="sec-head"><div class="eyebrow">Подробности</div><h2>Условия работы</h2></div>
  <div class="spec">
    ${specRows.map(r=>`<div class="row"><span class="k">${r.k}</span><span class="v ${r.y?'y':''}">${r.v}</span></div>`).join('')}
  </div>
</section>

<section style="padding-top:0">
  <div class="sec-head"><div class="eyebrow">Регламент</div><h2>Как проходит работа</h2></div>
  <div class="proc">
    ${M.steps.map(s=>`<div class="pstep"><div class="n">${s.n}</div><div><h3>${s.t}</h3><p>${s.d}</p></div></div>`).join('')}
  </div>
</section>

<section style="padding-top:0">
  <div class="sec-head"><div class="eyebrow">Стоимость</div><h2>Тарифы</h2>
  <p class="lead">Цена зависит от марки, модели и локации. Консультация — бесплатно.</p></div>
  <div class="ptable">
    ${M.pricing.map(p=>`<div class="prow ${p.note?'hit':''}">${p.note?`<span class="badge">${p.note}</span>`:''}<div class="top2"><span class="t">${p.t}</span><span class="p">${p.p}</span></div><div class="d">${p.d}</div></div>`).join('')}
  </div>
</section>

<section style="padding-top:0">
  <div class="sec-head"><div class="eyebrow">Портфолио</div><h2>Осмотренная техника</h2></div>
  <div class="ggrid">
    ${M.gallery.map((g,i)=>`<div class="gitem"><img src="${g.src}" loading="lazy" alt="${g.cap}"><div class="cp"><div class="ix">Осмотр № ${String(i+1).padStart(3,'0')}</div><p>${g.cap}</p></div></div>`).join('')}
  </div>
</section>

<section style="padding-top:0" id="reviews">
  <div class="sec-head"><div class="eyebrow">Отзывы</div><h2>Оценки клиентов</h2></div>
  <div class="ratebox">
    <div><div class="big">${M.rating}</div><div class="stars">★★★★★</div><div class="meta">${M.reviewsCount} оценок</div></div>
    <div class="bars">
      <div class="bar">5<div class="track"><div class="fill" style="width:99%"></div></div>125</div>
      <div class="bar">4<div class="track"><div class="fill" style="width:3%"></div></div>1</div>
      <div class="bar">3<div class="track"><div class="fill" style="width:0"></div></div>0</div>
      <div class="bar">2<div class="track"><div class="fill" style="width:0"></div></div>0</div>
      <div class="bar">1<div class="track"><div class="fill" style="width:0"></div></div>0</div>
    </div>
  </div>
</section>
<div class="revscroll">
  ${M.reviewShots.map(s=>`<div class="revcard" onclick="openLB('${s}')"><img src="${s}" loading="lazy" alt="отзыв"></div>`).join('')}
</div>
<p class="hint">// листайте · тап — открыть отзыв</p>

<section>
  <div class="sec-head"><div class="eyebrow">FAQ</div><h2>Частые вопросы</h2></div>
  <div class="faq">
    ${M.faq.map(f=>`<details class="qa"><summary>${f.q}<span class="plus"></span></summary><div class="a">${f.a}</div></details>`).join('')}
  </div>
</section>

<section style="padding-top:0">
  <div class="final">
    <div class="eyebrow" style="color:#5fd699">Заявка</div>
    <h2 style="margin-top:8px">Получите честное заключение</h2>
    <p>Пришлите модель или ссылку на объявление — выеду, проверю и составлю отчёт.</p>
    <div class="cta-row">
      <a class="btn btn-primary" href="javascript:openForm()">${ic.chat} Заказать осмотр</a>
      <a class="btn btn-ghost" href="${M.phoneHref}">${ic.phone} Позвонить</a>
    </div>
  </div>
</section>

<footer>
  <b>${M.expert.toUpperCase()} · ${M.brand.toUpperCase()}</b><br>
  Выездная диагностика мототехники · ${M.geo}<br>
  © ${new Date().getFullYear()} · фото и отзывы реальных клиентов
</footer>
`;

document.body.appendChild(el(`<div class="bottombar">
  <a class="btn btn-primary" href="javascript:openForm()">${ic.chat} Написать</a>
  <a class="btn btn-ghost" href="${M.phoneHref}">${ic.phone} Позвонить</a>
</div>`));

function openLB(s){document.getElementById('lbimg').src=s;document.getElementById('lb').classList.add('on');}
function closeLB(){document.getElementById('lb').classList.remove('on');}
document.getElementById('lb').addEventListener('click',e=>{if(e.target.id==='lb')closeLB();});
function formHTML(){return `
  <h3>Заказать осмотр</h3>
  <p class="s">Отвечу в течение нескольких часов. Консультация бесплатно.</p>
  <div class="field"><label>Имя</label><input id="f_name" placeholder="Как к вам обращаться"></div>
  <div class="field"><label>Телефон / мессенджер</label><input id="f_phone" placeholder="+7 ___ ___-__-__"></div>
  <div class="field"><label>Мотоцикл или ссылка на объявление</label><textarea rows="2" placeholder="Напр.: Honda CBR600RR 2008, ссылка…"></textarea></div>
  <button class="btn btn-primary" style="width:100%;height:52px;margin-top:4px" onclick="submitForm()">Отправить заявку</button>
  <button class="btn btn-ghost" style="width:100%;height:44px;margin-top:8px" onclick="closeForm()">Отмена</button>`;}
function openForm(){document.getElementById('sheet').innerHTML=formHTML();document.getElementById('modal').classList.add('on');}
function closeForm(){document.getElementById('modal').classList.remove('on');}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeForm();});
function submitForm(){sendLead();document.getElementById('sheet').innerHTML=`<div class="thanks"><div class="ok">${ck}</div><h3 style="font-size:21px">Заявка принята</h3><p class="s" style="margin:10px 0 18px">Дмитрий свяжется с вами в ближайшее время.</p><button class="btn btn-primary" style="width:100%;height:48px" onclick="closeForm()">Готово</button></div>`;}
Object.assign(window,{openLB,closeLB,openForm,closeForm,submitForm});
</script>
